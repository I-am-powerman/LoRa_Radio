<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoRa Radio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', monospace;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #e0e0e0;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background: #111;
      border-left: 1px solid #222;
      border-right: 1px solid #222;
    }

    /* --- Шапка --- */
    #header {
      padding: 12px 16px;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #222;
    }

    #header h1 {
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #888;
      flex: 1;
    }

    #freq {
      font-size: 11px;
      color: #4ade80;
      letter-spacing: 1px;
    }

    /* --- Индикатор режима --- */
    #mode-bar {
      padding: 8px 16px;
      background: #0d0d0d;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #mode-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      transition: background 0.3s;
    }

    #mode-dot.listening { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
    #mode-dot.idle      { background: #555; }

    #mode-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555;
      transition: color 0.3s;
    }

    #mode-label.listening { color: #4ade80; }

    /* --- Сообщения --- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }

    .msg.me     { align-self: flex-end;  align-items: flex-end; }
    .msg.friend { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.5;
      border-radius: 2px;
    }

    .msg.me     .bubble {
      background: #1a2a1a;
      color: #4ade80;
      border: 1px solid #2a3a2a;
      border-bottom-right-radius: 0;
    }

    .msg.friend .bubble {
      background: #1a1a2a;
      color: #93c5fd;
      border: 1px solid #2a2a3a;
      border-bottom-left-radius: 0;
    }

    .meta {
      font-size: 10px;
      color: #333;
      margin-top: 3px;
      letter-spacing: 1px;
    }

    /* --- Кнопка СЛУШАТЬ --- */
    #listen-area {
      padding: 16px;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: center;
    }

    #listen-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #333;
      background: #0d0d0d;
      color: #555;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #listen-btn .icon { font-size: 24px; }

    #listen-btn.active {
      border-color: #4ade80;
      color: #4ade80;
      background: #0a1a0a;
      box-shadow: 0 0 20px rgba(74, 222, 128, 0.2);
    }

    #listen-btn:active { transform: scale(0.95); }

    /* --- Отправка --- */
    #input-area {
      padding: 12px 16px;
      border-top: 1px solid #1a1a1a;
      display: none;
      gap: 8px;
    }

    #input-area.visible { display: flex; }

    #msg-input {
      flex: 1;
      padding: 9px 12px;
      border: 1px solid #222;
      border-radius: 2px;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      background: #0d0d0d;
      color: #e0e0e0;
      outline: none;
    }

    #msg-input::placeholder { color: #333; }
    #msg-input:focus { border-color: #4ade80; }

    #send-btn {
      padding: 9px 16px;
      border: 1px solid #4ade80;
      border-radius: 2px;
      background: transparent;
      color: #4ade80;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
    }

    #send-btn:hover  { background: #0a1a0a; }
    #send-btn:active { transform: scale(0.97); }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <h1>LoRa Radio</h1>
    <span id="freq">433.0 MHz</span>
  </div>

  <div id="mode-bar">
    <div id="mode-dot" class="idle"></div>
    <span id="mode-label" class="idle">ожидание</span>
  </div>

  <div id="messages"></div>

  <div id="listen-area">
    <button id="listen-btn">
      <span class="icon">📡</span>
      <span id="listen-label">СЛУШАТЬ</span>
    </button>
  </div>

  <div id="input-area">
    <input id="msg-input" type="text" placeholder="сообщение..." />
    <button id="send-btn">TX</button>
  </div>

</div>

<script>
  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('msg-input');
  const sendBtn     = document.getElementById('send-btn');
  const listenBtn   = document.getElementById('listen-btn');
  const listenLabel = document.getElementById('listen-label');
  const modeDot     = document.getElementById('mode-dot');
  const modeLabel   = document.getElementById('mode-label');

  let isListening = false;

  // --- Режим слушания ---
  listenBtn.addEventListener('click', () => {
    isListening = !isListening;

    listenBtn.classList.toggle('active', isListening);
    modeDot.className   = 'mode-dot ' + (isListening ? 'listening' : 'idle');
    modeLabel.className = isListening ? 'listening' : 'idle';
    modeLabel.textContent  = isListening ? 'слушаю эфир' : 'ожидание';
    listenLabel.textContent = isListening ? 'СТОП' : 'СЛУШАТЬ';

    // Показать/скрыть поле ввода
    document.getElementById('input-area').classList.toggle('visible', isListening);

    // Сообщить серверу о смене режима
    fetch('/mode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ listening: isListening })
    });
  });

  // --- Добавить сообщение в список ---
  function addMessage(text, sender, time) {
    const isMe = sender === 'me';
    const div  = document.createElement('div');
    div.className = 'msg ' + (isMe ? 'me' : 'friend');
    div.innerHTML = `
      <div class="bubble">${text}</div>
      <div class="meta">${time}</div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // --- Отправить сообщение ---
  sendBtn.addEventListener('click', () => {
    const text = inputEl.value.trim();
    if (!text) return;

    const now  = new Date();
    const time = now.getHours().toString().padStart(2, '0') + ':' +
                 now.getMinutes().toString().padStart(2, '0');

    fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, time: time })
    });

    inputEl.value = '';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendBtn.click();
  });

  // --- Получать новые сообщения каждые 2 секунды ---
  function fetchMessages() {
    fetch('/messages')
      .then(r => r.json())
      .then(data => {
        messagesEl.innerHTML = '';
        data.forEach(msg => addMessage(msg.text, msg.sender, msg.time));
      })
      .catch(err => console.log('Ошибка:', err));
  }

  setInterval(fetchMessages, 2000);
  fetchMessages();
</script>
</body>
</html>
