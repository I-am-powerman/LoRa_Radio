<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoRa Messenger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #0f0f0f;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #app {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background: #1a1a1a;
    }

    /* --- Шапка --- */
    #header {
      padding: 12px 16px;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a2a2a;
    }
    #header h1 { font-size: 16px; font-weight: 500; flex: 1; }
    #signal { font-size: 12px; color: #7C73E6; }

    /* --- Список сообщений --- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg { display: flex; flex-direction: column; max-width: 75%; }
    .msg.me    { align-self: flex-end;   align-items: flex-end; }
    .msg.friend { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.me     .bubble { background: #3C3489; color: #EEEDFE; border-bottom-right-radius: 4px; }
    .msg.friend .bubble { background: #2a2a2a; color: #e0e0e0; border-bottom-left-radius: 4px; }

    .meta { font-size: 11px; color: #555; margin-top: 3px; padding: 0 4px; }

    /* --- Поле ввода --- */
    #input-area {
      padding: 12px 16px;
      border-top: 1px solid #2a2a2a;
      display: flex;
      gap: 8px;
      background: #111;
    }

    #msg-input {
      flex: 1;
      padding: 9px 14px;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 14px;
      outline: none;
      background: #222;
      color: #e0e0e0;
    }
    #msg-input::placeholder { color: #555; }
    #msg-input:focus { border-color: #534AB7; }

    #send-btn {
      padding: 9px 18px;
      border-radius: 20px;
      border: none;
      background: #534AB7;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    #send-btn:active { opacity: 0.85; }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <h1>LoRa Messenger</h1>
    <span id="signal">433 MHz</span>
  </div>

  <div id="messages" id="messages">
    <!-- Сообщения появятся здесь -->
  </div>

  <div id="input-area">
    <input id="msg-input" type="text" placeholder="Сообщение..." />
    <button id="send-btn">Отправить</button>
  </div>

</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('msg-input');
  const btnEl      = document.getElementById('send-btn');

  // --- Добавить сообщение в список ---
  function addMessage(text, sender, time) {
    const isMe = sender === 'me';
    const div = document.createElement('div');
    div.className = 'msg ' + (isMe ? 'me' : 'friend');
    div.innerHTML = `
      <div class="bubble">${text}</div>
      <div class="meta">${time}</div>
    `;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // --- Отправить сообщение на сервер ---
  btnEl.addEventListener('click', () => {
    const text = inputEl.value.trim();
    if (!text) return;

    // TODO: отправить POST запрос на /send
    fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });

    inputEl.value = '';
  });

  // Enter тоже отправляет
  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') btnEl.click();
  });

  // --- Получать новые сообщения каждые 3 секунды ---
  function fetchMessages() {
    // TODO: GET запрос на /messages
    fetch('/messages')
      .then(r => r.json())
      .then(data => {
        messagesEl.innerHTML = '';
        data.forEach(msg => {
          addMessage(msg.text, msg.sender, msg.time);
        });
      })
      .catch(err => console.log('Ошибка:', err));
  }

  setInterval(fetchMessages, 3000);
  fetchMessages(); // сразу при загрузке
</script>
</body>
</html>
